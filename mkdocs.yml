site_name: mpfi
site_description: Static index of structural fragility in tabular ML pipelines
site_url: https://smirnoffmg.github.io/mpfi/

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true

nav:
  - Home: index.md
  - API: api.md
